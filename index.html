<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huỳnh Tấn Hiển – Trang cá nhân</title>
<style>
:root{--bg:#234660;--card:#1c3a52;--ink:#fff;--accent:#ff2d6f;--btn:#a8d0dd;--tag:#bfe8d4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Times New Roman",Times,serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:100%;max-width:480px;background:var(--bg);position:relative;padding-bottom:60px}
.banner{height:230px;border-radius:0 0 24px 24px;position:relative;overflow:hidden;border-bottom:2px solid #dfe9ee;background:#0b2e47 center/cover no-repeat}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,20,35,.6),rgba(5,20,35,.05) 65%)}
.hello{position:absolute;top:2px;left:50px;font-family:"Times New Roman",Times,serif;font-size:56px;font-weight:700;color:#c9f5d8;font-style:italic;z-index:2;text-shadow:0 0 12px rgba(120,255,200,.4)}
.avatar{position:absolute;left:6px;top:58px;width:172px;height:172px;border-radius:50%;border:5px solid #0f4a3f;background:#cfd8dc center/cover no-repeat;z-index:3;display:flex;align-items:center;justify-content:center;font-size:64px}
.tagline{margin:22px 16px 0;font-style:italic;font-weight:700;font-size:18px;color:var(--tag);text-transform:uppercase;letter-spacing:.2px}
.socials{display:flex;justify-content:space-between;align-items:center;padding:30px 24px 0}
.socials a{width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .2s}
.socials a:hover{transform:translateY(-4px) scale(1.08)}
.socials svg{width:100%;height:100%}
.doc{margin-top:60px;text-align:center;padding:0 16px}
.doc h2{display:flex;align-items:center;justify-content:center;gap:12px;margin:0;font-size:44px;font-style:italic;text-transform:uppercase;line-height:1.05;text-align:left}
.doc h2 svg{width:72px;height:72px;flex:none}
.go{display:inline-block;margin-top:28px;padding:16px 22px;background:var(--btn);color:var(--accent);font:800 22px/1 "Times New Roman",Times,serif;text-decoration:none;border-radius:4px;transition:transform .2s,filter .2s}
.go:hover{transform:scale(1.06);filter:brightness(1.08)}
/* edit */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;padding:12px 18px;background:#fff;color:#123;font:700 15px "Times New Roman",Times,serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
.panel.open{display:flex}
.sheet{background:#fff;color:#12212b;width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;font:15px "Times New Roman",Times,serif}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet label{display:block;margin:10px 0 4px;font-weight:700;font-size:13px}
.sheet input[type=text],.sheet input[type=url]{width:100%;padding:10px;border:1px solid #b8c6cf;border-radius:8px;font-size:15px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row button{flex:1;padding:12px;border:0;border-radius:8px;font:700 15px "Times New Roman",Times,serif;cursor:pointer}
.save{background:#0b6e4f;color:#fff}.cancel{background:#e3eaee}.reset{background:#fbe0e0;color:#a11}
</style>
</head>

const $=id=>document.getElementById(id);
let S={...DEF};
try{const j=$("state").textContent.trim();if(j)S={...DEF,...JSON.parse(j)}}catch(e){}
const fields=["hello","tagline","tiktok","facebook","instagram","zalo","linkedin","doctitle","docbtn","doc"];
function zaloUrl(v){v=v.trim();return /^https?:/.test(v)?v:"https://zalo.me/"+v.replace(/\D/g,"")}
function render(){
  $("hello").textContent=S.hello;$("tagline").textContent=S.tagline;
  $("doctitle").textContent=S.doctitle;$("l-doc").textContent=S.docbtn;$("l-doc").href=S.doc;
  ["tiktok","facebook","instagram","linkedin"].forEach(k=>$("l-"+k).href=S[k]);
  $("l-zalo").href=zaloUrl(S.zalo);
  $("banner").style.backgroundImage=S.banner?"url("+S.banner+")":"";
  const a=$("avatar");
  if(S.photo){a.style.backgroundImage="url("+S.photo+")";a.textContent=""}else{a.style.backgroundImage="";a.textContent="🙂"}
}
function openPanel(){fields.forEach(k=>$("f-"+k).value=S[k]);$("panel").classList.add("open")}
function diff(){const d={};for(const k in S)if(S[k]!==DEF[k])d[k]=S[k];return d}
function buildHtml(){const c=document.documentElement.cloneNode(true);
  c.querySelector("#state").textContent=JSON.stringify(diff()).replace(/</g,"\\u003c");
  c.querySelector("#panel").classList.remove("open");
  return "<!DOCTYPE html>\n"+c.outerHTML}
async function commit(){
  try{const a=window.claude&&await window.claude.use("artifact");
    if(!a){alert("Chưa lưu được vì trang đang chạy ở chế độ xem trước.");return}
    await a.publish(buildHtml());
  }catch(e){
    if(e&&e.code==="conflict")return;
    if(e&&(e.code==="not_writer"||e.code==="not_granted"))alert("Bạn không có quyền lưu thay đổi trên trang này.");
    else alert("Không lưu được, vui lòng thử lại.")}}
$("editBtn").onclick=openPanel;
$("cancel").onclick=()=>$("panel").classList.remove("open");
$("save").onclick=()=>{fields.forEach(k=>S[k]=$("f-"+k).value);render();$("panel").classList.remove("open");commit()};
$("reset").onclick=()=>{if(confirm("Đặt lại toàn bộ về mặc định?")){S={...DEF};render();$("panel").classList.remove("open");commit()}};
function pick(id,key,m){$(id).onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image(),fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,m/Math.max(img.width,img.height));
    c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    S[key]=c.toDataURL("image/jpeg",.85);render();commit()};img.src=fr.result};fr.readAsDataURL(f)}}
